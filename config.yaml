# tcg-restock-watch config
# Secrets (discord_webhook, bestbuy_api_key) go in config.local.yaml, which is gitignored.

# Discord: make a private server, add a #drops channel, then
# channel settings > Integrations > Webhooks > New Webhook > Copy Webhook URL.
# In the Discord app, set that channel's notifications to "All Messages".
# In-stock alerts also ping @everyone so the phone buzzes even on "Mentions only".
discord_webhook: ""
discord_mention_everyone: true
# Permanent invite link for the "Join on Discord" button on the status page (config.local.yaml).
discord_invite: ""

# Optional second channel: ntfy.sh topic (leave blank to skip).
ntfy_topic: ""

# Poll interval per retailer, in seconds. Jitter of +-15% is added automatically.
# Target: one batched request for every TCIN. Best Buy without an API key loads one
# page per product in the background browser (about 6 s each), so keep it slow;
# with a free key from developer.bestbuy.com it becomes one request and 60 s is fine.
intervals:
  target: 90
  bestbuy: 600
  walmart: 600
  gamestop: 180

# Alert but do NOT open the page when price exceeds msrp * max_price_ratio.
max_price_ratio: 1.10

# What to do on your PC when a drop lands at an acceptable price:
#   open  = open the product page in your normal browser (logged in, no bot signals). You click Add to cart.
#   auto  = controlled Chrome adds it to the cart for you. Trips bot checks on Target/Walmart; opt-in.
#   off   = alert only.
cart: open

# Best Buy official API key (free, instant): https://developer.bestbuy.com/  (put it in config.local.yaml)
bestbuy_api_key: ""

# Target uses store + zip for its fulfillment lookup. Online shipping status is
# what triggers the alert; the store only affects pickup fields.
zip_code: "95035"
target_store_id: "626"

# Where state, log, and the background Chrome profile live.
data_dir: "~/.tcg-watch"

# Unused as of 2026-09-07: alerts now fire only on a genuine restock (out of stock -> in stock),
# never as a "still in stock" reminder on a timer. That re-alert loop pinged @everyone every
# realert_minutes forever for a product that never actually sold out. Kept here in case a
# scoped, per-product version of this is worth reintroducing later.
realert_minutes: 30

# Retire a product (hide it, stop polling it) when no retailer has had it in stock for
# this many days since it was first seen, or when every retailer has delisted it for
# retire_missing_days. Retired products sit in a collapsed section at the bottom of the page.
retire_after_days: 60
retire_missing_days: 7

# TCGplayer market price, for the "MSRP vs market" comparison on the status page.
# One product is looked up every market_interval seconds and kept for a day, so the
# list fills in over the first hour and then refreshes as a slow trickle.
market: true
market_interval: 45

# Rebuild and redeploy the status page (npx vercel) when stock or prices change,
# at most once per 5 minutes. Needs `npx vercel login` done once on this PC.
site_deploy: true

# Reddit deal feeds: free, fast signal for stores that block bots (Pokemon Center,
# Costco, Sam's Club, Amazon). Any new post whose title contains a keyword alerts
# your phone with the post's link. Checked every feed_interval seconds.
feed_interval: 120
feeds:
  - subreddit: PokemonTCGDeals
    keywords: ["pokemon center", "pokémon center", "restock", "in stock", "target", "best buy", "walmart", "costco", "sam's club", "amazon"]
    exclude: ["ebay", "tcgplayer", "wts", "[w]", "whatnot"]
  - subreddit: OnePieceTCG
    keywords: ["restock", "in stock", "preorder", "pre-order", "best buy", "target", "walmart"]
    exclude: ["wts", "wtb", "trade", "[w]"]

